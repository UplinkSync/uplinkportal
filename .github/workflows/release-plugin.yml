name: Release Plugin

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build plugin zip
        run: |
          set -euo pipefail
          pkg_dir="dist/uplinkportal"
          rm -rf dist
          mkdir -p "$pkg_dir"

          cp uplinkportal.php "$pkg_dir/"
          cp docs/reference/wordpress-readme.txt "$pkg_dir/readme.txt"
          cp LICENSE "$pkg_dir/"
          cp -R assets "$pkg_dir/"
          cp -R includes "$pkg_dir/"
          cp -R src "$pkg_dir/"

          if [[ -d languages ]]; then
            cp -R languages "$pkg_dir/"
          fi

          (cd dist && zip -r "uplinkportal.zip" "uplinkportal")

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/uplinkportal.zip
