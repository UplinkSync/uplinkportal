name: CI

on:
  pull_request:

jobs:
  plugin-php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Lint plugin PHP files
        run: |
          set -euo pipefail
          files=(uplinkportal.php $(find includes src tests -type f -name '*.php' | sort))
          for file in "${files[@]}"; do
            php -l "$file"
          done

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install cspell
        run: npm install --no-save cspell

      - name: Composer lint (PHPCS + cspell)
        run: composer lint

      - name: PHPUnit
        run: composer test

  js-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build JS assets
        run: npm run build

      - name: Check for stale dist files
        run: |
          if ! git diff --exit-code assets/js/dist/; then
            echo "ERROR: assets/js/dist/ files are stale. Run 'npm run build' and commit the result."
            exit 1
          fi

  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run sensitive-content and pro-boundary scan
        run: ./infrastructure/scripts/repo-hygiene-scan.sh

  worker-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck
