name: Deploy Worker

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_DATABASE_URL: ${{ secrets.WORKER_DATABASE_URL }}
      WORKER_NAME: <PLUGIN_SLUG_PLACEHOLDER>-license-server
    defaults:
      run:
        working-directory: infrastructure/worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          set -euo pipefail
          missing=()
          [[ -z "$CLOUDFLARE_API_TOKEN" ]] && missing+=("CLOUDFLARE_API_TOKEN")
          [[ -z "$CLOUDFLARE_ACCOUNT_ID" ]] && missing+=("CLOUDFLARE_ACCOUNT_ID")
          [[ -z "$WORKER_DATABASE_URL" ]] && missing+=("WORKER_DATABASE_URL")

          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required secrets: ${missing[*]}"
            echo "Add missing secrets with gh CLI commands:"
            for secret_name in "${missing[@]}"; do
              echo "gh secret set ${secret_name} --body '<value>'"
            done
            echo "After adding secrets, re-run Actions > Deploy Worker > Run workflow."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Push worker secrets to Cloudflare
        run: |
          set -euo pipefail
          printf '%s' "$WORKER_DATABASE_URL" | npx wrangler secret put DATABASE_URL --name "$WORKER_NAME"

      - name: Deploy worker
        run: npx wrangler deploy --name "$WORKER_NAME"
