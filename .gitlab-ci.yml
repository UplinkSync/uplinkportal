# Single source of truth: this project extends the shared WordPress-plugin CI
# pipeline (validate -> security -> build -> per-branch review app), which also
# carries the OSS license gate (composer + npm). Do NOT re-add a local
# /.gitlab/ci/wordpress-plugin.yml — extend the shared template so there is no
# drift.
include:
  - project: 'ops/ci-templates'
    ref: main
    file: '/templates/wordpress-plugin.gitlab-ci.yml'

variables:
  PLUGIN_SLUG: "uplinkportal"
  VAULT_ROLE: "wp-plugin-uplinkportal"
  GITHUB_ORG: "UplinkSync"
  GITHUB_REPO: "uplinkportal"
  SQUASH_COMMIT_PREFIX: "release"
